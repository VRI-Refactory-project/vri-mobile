name: VRI Mobile CI Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # run: npm ci
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
